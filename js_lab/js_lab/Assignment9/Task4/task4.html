<html>
<head>
  <title>Assignment 9 - Task 4</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    button { padding: 6px 14px; font-size: 15px; margin-top: 8px; }
  </style>
</head>
<body>
  <h3>What is 2 + 3?</h3>
  <label><input type="radio" name="ans" value="4"> 4</label><br>
  <label><input type="radio" name="ans" value="5"> 5</label><br>
  <label><input type="radio" name="ans" value="6"> 6</label><br>
  <button id="check">Check answer</button>
  <p id="result"></p>

  <script>
    document.getElementById("check").addEventListener("click", function () {
      const chosen = document.querySelector("input[name='ans']:checked");
      const result = document.getElementById("result");
      if (chosen && chosen.value === "5") {
        result.textContent = "Correct";
      } else {
        result.textContent = "Try again";
      }
    });
  </script>
</body>
</html>
